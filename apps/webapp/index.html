<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0d17" />
    <!-- The desktop shell's update gate: it only adopts a deployed bundle
         that declares desktop support, so a rollback or a pre-desktop deploy
         can never strip the app of its own titlebar. Bump on breaking shell
         API changes. -->
    <meta name="yappy-desktop" content="1" />
    <title>yappy</title>
    <!--
      The API and the socket are on other origins, so the first request to
      each pays for DNS, TCP and TLS before it sends a byte. Started here, in
      the head, they are warm by the time the bundle has parsed and `bootstrap`
      dials them — roughly a round trip saved on every cold visit.
    -->
    <link rel="preconnect" href="https://api.yappy.gg" crossorigin />
    <link rel="preconnect" href="https://ws.yappy.gg" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
