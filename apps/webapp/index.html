<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0d17" />
    <!-- The desktop shell's update gate: it only adopts a deployed bundle
         that declares desktop support, so a rollback or a pre-desktop deploy
         can never strip the app of its own titlebar. Bump on breaking shell
         API changes. -->
    <meta name="yappy-desktop" content="1" />
    <title>yappy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
