// Compose treats any class containing a List as unstable unless told
// otherwise, and every model in data/ carries one — so every visible bubble
// re-ran its body whenever anything in the chat changed, because the compiler
// could not prove the Message it was handed was the same Message. All model
// classes are @Serializable value holders that are never mutated after
// decode; declaring the package stable lets equal mean unchanged, which is
// what allows a bubble (or a conversation row) to be skipped at all.
gg.yappy.app.data.**
