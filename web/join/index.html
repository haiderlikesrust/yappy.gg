<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a group on yappy</title>
<meta name="description" content="You have been invited to a group on yappy.">

<!-- An invite link is a capability. Indexing one would publish it. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
 * Same design language as the landing page: Space Grotesk, violet-charcoal
 * surfaces, and a squircle for the group because a squircle is a place.
 */
:root {
  --surface: #17151f;
  --surface-2: #201d2b;
  --text: #f2f0f8;
  --text-2: #b3adc9;
  --text-3: #726c8c;
  --accent: #8b7cff;
  --accent-2: #00cec9;
  --radius: 22px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--surface);
  color: var(--text);
  font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
}

/* The same violet bloom the landing hero uses, so the two pages feel like one
   site rather than two templates. */
body::before {
  content: '';
  position: fixed;
  inset: -30% 10% auto -10%;
  height: 560px;
  background: radial-gradient(closest-side, rgba(139,124,255,.18), transparent 70%);
  pointer-events: none;
}

main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 40px 20px;
  position: relative;
}

.card {
  width: 100%;
  max-width: 420px;
  background: var(--surface-2);
  border: 1px solid rgba(255,255,255,.055);
  border-radius: var(--radius);
  padding: 34px 30px 30px;
  text-align: center;
}

.lockup { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; margin-bottom: 26px; }
.lockup img { height: 20px; display: block; }
.lockup .word {
  font-size: 19px; font-weight: 700; letter-spacing: -0.02em;
  background: linear-gradient(100deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.kicker {
  font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-3); margin: 0 0 18px;
}

/* Squircle, not a circle: this is a place, not a person. */
.avatar {
  width: 92px; height: 92px; border-radius: 29px;
  margin: 0 auto 18px; display: block;
  object-fit: cover;
  background: linear-gradient(150deg, rgba(139,124,255,.35), rgba(0,206,201,.22));
  border: 1px solid rgba(255,255,255,.08);
}
/* The fallback when a group has no picture: its initial. */
.avatar.letter {
  display: grid; place-items: center;
  font-size: 38px; font-weight: 700; color: var(--text);
}

h1 {
  font-size: 27px; line-height: 1.2; letter-spacing: -0.03em;
  margin: 0 0 6px; font-weight: 700;
  overflow-wrap: anywhere;
}

.badge {
  display: inline-block; vertical-align: middle; margin-left: 7px;
  font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  color: var(--accent); background: rgba(139,124,255,.14);
  padding: 3px 9px; border-radius: 999px;
}

.meta { color: var(--text-3); font-size: 14px; margin: 0 0 14px; }
.meta .dot { opacity: .5; margin: 0 7px; }

.desc {
  color: var(--text-2); font-size: 15px; margin: 0 0 26px;
  overflow-wrap: anywhere;
  /* Three lines is a description; more is a manifesto pushing the button off
     the fold on a small phone. */
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}

.btn {
  display: block; width: 100%;
  padding: 14px 18px; border-radius: 14px;
  font-family: inherit; font-size: 16px; font-weight: 600;
  text-decoration: none; text-align: center; cursor: pointer;
  border: 1px solid transparent; transition: .18s;
}
.btn.primary {
  background: linear-gradient(100deg, var(--accent), #6f5dff);
  color: #fff;
  box-shadow: 0 10px 26px rgba(139,124,255,.28);
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost {
  background: transparent; color: var(--text-2);
  border-color: rgba(255,255,255,.1); margin-top: 10px;
}
.btn.ghost:hover { color: var(--text); background: rgba(255,255,255,.05); }

.hint { color: var(--text-3); font-size: 13px; margin: 18px 0 0; }
.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 15px; color: var(--text-2);
  background: rgba(255,255,255,.05); border-radius: 8px;
  padding: 3px 9px; letter-spacing: .06em;
}

/* Skeleton: the card is the right size before the answer arrives, so nothing
   jumps when it does. */
.skeleton { animation: pulse 1.4s ease-in-out infinite; }
.skeleton .bar { background: rgba(255,255,255,.06); border-radius: 8px; margin: 0 auto 12px; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }

footer {
  position: relative;
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 22px 20px;
  color: var(--text-3); font-size: 13px;
  display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
}
footer a { color: inherit; text-decoration: none; opacity: .8; }
footer a:hover { opacity: 1; }

@media (max-width: 420px) {
  .card { padding: 28px 22px 24px; }
  h1 { font-size: 24px; }
}
</style>
</head>
<body>

<main>
  <div class="card" id="card">
    <a class="lockup" href="/"><img src="/mark.png" alt=""><span class="word">yappy</span></a>
    <div id="body" class="skeleton">
      <div class="bar" style="width:92px;height:92px;border-radius:29px;margin-bottom:18px"></div>
      <div class="bar" style="width:60%;height:22px"></div>
      <div class="bar" style="width:40%;height:14px"></div>
      <div class="bar" style="width:100%;height:48px;border-radius:14px;margin-top:24px"></div>
    </div>
  </div>
</main>

<footer>
  <a href="/">yappy.gg</a>
  <a href="/terms/">Terms</a>
  <a href="/privacy/">Privacy</a>
</footer>

<script>
/*
 * The invite landing page.
 *
 * On a phone with the app installed and its links verified, this page is never
 * seen: the OS hands the URL straight to the app. So everyone who does see it
 * is in one of three situations — no app, an install whose link verification
 * has not gone through, or a desktop browser — and all three need the same two
 * things: proof the invite is real, and a way into the app.
 *
 * No framework, for the same reason as the portal: this is one fetch and one
 * button, and a build step would outweigh it.
 */

// Same derivation the portal uses, which is what makes the page work unchanged
// on the backup domain: on tenku.xyz it talks to api.tenku.xyz.
const API = (() => {
  const host = location.hostname;
  if (host === 'localhost' || host === '127.0.0.1') return 'http://localhost:3000/v1';
  return `https://api.${host.replace(/^www\./, '')}/v1`;
})();

// /join/<code>, with or without a trailing slash.
const code = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');

const body = document.getElementById('body');

/** Build an element and set its text as *text*. Group titles and descriptions
 *  are user-written, and this page must never be a way to get markup into
 *  someone else's browser. */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function render(nodes) {
  body.className = '';
  body.replaceChildren(...nodes);
}

function showDead(title, detail) {
  render([
    el('p', 'kicker', 'Invite'),
    el('h1', null, title),
    el('p', 'desc', detail),
    Object.assign(el('a', 'btn ghost', 'Go to yappy.gg'), { href: '/' }),
  ]);
}

function showGroup(c) {
  const nodes = [];

  nodes.push(el('p', 'kicker', 'You have been invited to join'));

  if (c.avatarUrl) {
    const img = el('img', 'avatar');
    img.src = c.avatarUrl;
    img.alt = '';
    // A picture that fails to load should degrade to the initial, not to a
    // broken-image icon on an otherwise finished card.
    img.onerror = () => img.replaceWith(letterAvatar(c.title));
    nodes.push(img);
  } else {
    nodes.push(letterAvatar(c.title));
  }

  const h1 = el('h1', null, c.title || 'A group on yappy');
  if (c.badge) h1.appendChild(el('span', 'badge', c.badge));
  nodes.push(h1);

  const kind = c.type === 'space' ? 'Space' : c.type === 'channel' ? 'Channel' : 'Group';
  const meta = el('p', 'meta');
  meta.appendChild(el('span', null, kind));
  meta.appendChild(el('span', 'dot', '·'));
  meta.appendChild(el('span', null, `${c.memberCount} ${c.memberCount === 1 ? 'member' : 'members'}`));
  nodes.push(meta);

  if (c.description) nodes.push(el('p', 'desc', c.description));

  // The app-scheme link rather than this same https URL: if we are on this page
  // the https link has already failed to open the app, so re-following it would
  // just reload the page. yappy:// works with no domain verification at all.
  const open = el('a', 'btn primary', 'Open in the yappy app');
  open.href = `yappy://join/${encodeURIComponent(code)}`;
  nodes.push(open);

  // Straight to the builds, not the marketing page. Somebody who has clicked an
  // invite has already decided; making them find the download from the top of
  // the site is where that decision gets lost.
  const get = el('a', 'btn ghost', 'Get yappy first');
  get.href = '/download/';
  nodes.push(get);

  // Installing loses the link that brought you here — the app opens on an
  // empty home screen with no memory of it. So the code is worth having, and
  // it now has somewhere to go: New chat, "Have an invite code?".
  const hint = el('p', 'hint');
  hint.appendChild(document.createTextNode('Just installed? Come back to this link, or enter '));
  hint.appendChild(el('span', 'code', code));
  hint.appendChild(document.createTextNode(' under New chat.'));
  nodes.push(hint);

  render(nodes);
}

function letterAvatar(title) {
  const node = el('div', 'avatar letter', (title || '?').trim().charAt(0).toUpperCase());
  return node;
}

async function load() {
  if (!code) {
    showDead('No invite code', 'This link is missing its code. Ask whoever sent it for a new one.');
    return;
  }

  document.title = 'Join a group on yappy';

  try {
    const res = await fetch(`${API}/conversations/invites/${encodeURIComponent(code)}/preview`);

    if (res.status === 404) {
      showDead(
        'This invite is no longer valid',
        'It may have expired, been used up, or been revoked by the group. Ask for a fresh link.',
      );
      return;
    }
    if (res.status === 429) {
      showDead('Too many attempts', 'Wait a minute and reload the page.');
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const { conversation } = await res.json();
    showGroup(conversation);
    if (conversation.title) document.title = `Join ${conversation.title} on yappy`;
  } catch (err) {
    // A network failure is not an invalid invite, and saying so would send
    // someone off to ask for a new link that would work no better.
    showDead('Could not load this invite', 'Check your connection and reload the page.');
  }
}

load();
</script>

</body>
</html>
