:root {
  --yellow: #fdc003;
  --ink: #17151f;
  --ink-2: #4b4560;
  --ink-3: #726c8c;
  --paper: #fffdf6;
  --accent: #6c5ce7;
  --radius: 26px;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background:
    radial-gradient(rgba(23,21,31,.05) 1.3px, transparent 1.3px) 0 0 / 22px 22px,
    var(--yellow);
  color: var(--ink);
  font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased; line-height: 1.55;
  display: grid; place-items: center; padding: 30px 20px;
}
.card {
  width: 100%; max-width: 480px; background: var(--paper);
  border-radius: var(--radius); padding: 38px 34px;
  box-shadow: 0 30px 70px rgba(120, 86, 0, .35);
  text-align: center;
}
.lockup { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; margin-bottom: 24px; }
.lockup .tile { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--yellow); }
.lockup .tile img { height: 20px; display: block; }
.lockup .word { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

h1 { font-size: 32px; letter-spacing: -0.03em; margin: 0 0 8px; }
.sub { color: var(--ink-2); margin: 0 0 30px; font-size: 16px; }

.store {
  display: block; text-align: left; text-decoration: none;
  border: 1px solid rgba(23,21,31,.1); border-radius: 18px;
  padding: 18px 20px; margin-bottom: 14px; transition: .18s;
  background: #fff;
}
.store:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(23,21,31,.12); }
.store .top { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.store .top svg { width: 20px; height: 20px; flex: none; }
.store .note { display: block; color: var(--ink-3); font-size: 14px; margin-top: 3px; }
.store.soon { opacity: .8; }
.store .pill {
  margin-left: auto; font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--accent);
  background: rgba(108, 92, 231, .12); border-radius: 999px; padding: 4px 10px;
  white-space: nowrap;
}
.fine { color: var(--ink-3); font-size: 13.5px; margin-top: 22px; }
.fine a { color: var(--ink-2); }
